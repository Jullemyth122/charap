<div [ngClass]="themeService.isDarkMode() ? 'dark-mode' : 'light-mode'" class="app-shell">
  <app-header></app-header>

  <div class="app-content-wrapper">
    <router-outlet></router-outlet>
  </div>

  <!-- Account & Auth Modal -->
  @if (authService.isAuthModalOpen()) {
    <app-auth-modal
      [isDarkMode]="themeService.isDarkMode()"
      (close)="authService.closeAuthModal()"
    ></app-auth-modal>
  }
</div>
